name: X Cloud Free Collector
on:
  schedule:
    # Redundant pre-report runs. GitHub scheduled jobs can be delayed, so use
    # three free checkpoints instead of relying on one 06:25 JST trigger.
    - cron: '30 19 * * *'  # 04:30 JST
    - cron: '30 20 * * *'  # 05:30 JST
    - cron: '15 21 * * *'  # 06:15 JST
  workflow_dispatch:
  # One-shot repair/UAT trigger for semantic X search validation. Remove after verification.
  push:
    branches: [main]
    paths:
      - '.github/workflows/x-cloud-free.yml'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'twikit @ git+https://github.com/unclecode/twikit.git' pyyaml python-dotenv requests beautifulsoup4
      - name: Collect X whitelist read-only
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: python scripts/export_x_cloud.py
      - name: Discover X candidates read-only
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: |
          python -m venv /tmp/xsearch
          /tmp/xsearch/bin/pip install 'twikit @ git+https://github.com/sakenuGOD/twikit.git@e9b5acf140492fb642b2e5322a9ad55ee10415bc' pyyaml python-dotenv
          /tmp/xsearch/bin/python scripts/export_x_discovery.py
          if ! /tmp/xsearch/bin/python - <<'PY'
          import json
          import sys
          with open("cloud-output/x-discovery-latest.json", encoding="utf-8") as f:
              data = json.load(f)
          sys.exit(0 if data.get("semantic_health") == "HEALTHY" else 1)
          PY
          then
            echo "SearchTimeline discovery is not semantically healthy; using browser read-only fallback."
            /tmp/xsearch/bin/pip install playwright
            /tmp/xsearch/bin/python scripts/export_x_browser_discovery.py
          fi
      - name: Discover web/news candidates
        run: python scripts/export_web_discovery.py
      - name: Collect official GitHub Trending snapshot
        run: python scripts/export_github_trending.py
      - name: Publish cache
        run: |
          cp cloud-output/x-latest.json /tmp/x-latest.json
          cp cloud-output/x-discovery-latest.json /tmp/x-discovery-latest.json
          cp cloud-output/web-discovery-latest.json /tmp/web-discovery-latest.json
          cp cloud-output/github-trending-latest.json /tmp/github-trending-latest.json
          git config user.name ai-daily-news-bot
          git config user.email actions@users.noreply.github.com
          git switch --orphan x-cloud-cache
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/x-latest.json x-latest.json
          cp /tmp/x-discovery-latest.json x-discovery-latest.json
          cp /tmp/web-discovery-latest.json web-discovery-latest.json
          cp /tmp/github-trending-latest.json github-trending-latest.json
          echo "# AI Daily News Cloud Cache" > README.md
          git add x-latest.json x-discovery-latest.json web-discovery-latest.json github-trending-latest.json README.md
          git commit -m "chore: refresh cloud source caches"
          git push --force origin HEAD:x-cloud-cache
