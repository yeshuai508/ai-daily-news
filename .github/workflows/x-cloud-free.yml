name: X Cloud Free Collector
on:
  schedule:
    - cron: '25 21 * * *'
  workflow_dispatch:
  push:
    branches:
      - x-cloud-uat-trigger-2
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'twikit @ git+https://github.com/unclecode/twikit.git' pyyaml python-dotenv
      - name: Collect X whitelist read-only
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: python scripts/export_x_cloud.py
      - name: Publish cache
        run: |
          cp cloud-output/x-latest.json /tmp/x-latest.json
          git config user.name ai-daily-news-bot
          git config user.email actions@users.noreply.github.com
          git switch --orphan x-cloud-cache
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/x-latest.json x-latest.json
          echo "# X Cloud Cache" > README.md
          git add x-latest.json README.md
          git commit -m "chore: refresh X cloud cache"
          git push --force origin HEAD:x-cloud-cache
