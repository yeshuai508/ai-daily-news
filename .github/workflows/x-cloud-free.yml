name: X Cloud Free Collector
on:
  schedule:
    # Redundant pre-report runs. GitHub scheduled jobs can be delayed, so use
    # three free checkpoints instead of relying on one 06:25 JST trigger.
    - cron: '30 19 * * *'  # 04:30 JST
    - cron: '30 20 * * *'  # 05:30 JST
    - cron: '15 21 * * *'  # 06:15 JST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'twikit @ git+https://github.com/unclecode/twikit.git' pyyaml python-dotenv requests beautifulsoup4
      - name: Collect X whitelist read-only
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: python scripts/export_x_cloud.py
      - name: Discover X candidates read-only
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 21 * * *'
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: |
          if python - <<'PY'
          import json, sys
          d=json.load(open("cloud-output/x-latest.json",encoding="utf-8"))
          sys.exit(0 if d.get("coverage")=="COMPLETE" else 1)
          PY
          then
            python scripts/export_x_network_discovery.py
          else
            python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          p=Path("cloud-output/x-discovery-latest.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          now=datetime.now(ZoneInfo("Asia/Tokyo")).isoformat()
          p.write_text(json.dumps({
            "schema":"ai-daily-news.x-discovery.v1",
            "generated_at":now,
            "write_actions":"NONE",
            "scope":"DYNAMIC_NETWORK_EXPANSION_FROM_CORE_X",
            "candidate_only":True,
            "verification_required":True,
            "coverage":"SKIPPED_CORE_X_PARTIAL",
            "semantic_health":"DEGRADED",
            "items":[],
            "note":"Core X was not COMPLETE; skipped extra X calls so Web/GitHub discovery can continue."
          },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          fi
      - name: Mark X discovery not run at early checkpoints
        if: github.event_name == 'schedule' && github.event.schedule != '15 21 * * *'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          p=Path("cloud-output/x-discovery-latest.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          now=datetime.now(ZoneInfo("Asia/Tokyo")).isoformat()
          p.write_text(json.dumps({
            "schema":"ai-daily-news.x-discovery.v1",
            "generated_at":now,
            "write_actions":"NONE",
            "scope":"DYNAMIC_NETWORK_EXPANSION_FROM_CORE_X",
            "candidate_only":True,
            "verification_required":True,
            "coverage":"NOT_RUN_EARLY_CHECKPOINT",
            "semantic_health":"NOT_DUE",
            "items":[]
          },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Discover web/news candidates
        run: python scripts/export_web_discovery.py
      - name: Collect official GitHub Trending snapshot
        run: python scripts/export_github_trending.py
      - name: Publish cache
        run: |
          cp cloud-output/x-latest.json /tmp/x-latest.json
          cp cloud-output/x-discovery-latest.json /tmp/x-discovery-latest.json
          cp cloud-output/web-discovery-latest.json /tmp/web-discovery-latest.json
          cp cloud-output/github-trending-latest.json /tmp/github-trending-latest.json
          git config user.name ai-daily-news-bot
          git config user.email actions@users.noreply.github.com
          git switch --orphan x-cloud-cache
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/x-latest.json x-latest.json
          cp /tmp/x-discovery-latest.json x-discovery-latest.json
          cp /tmp/web-discovery-latest.json web-discovery-latest.json
          cp /tmp/github-trending-latest.json github-trending-latest.json
          echo "# AI Daily News Cloud Cache" > README.md
          git add x-latest.json x-discovery-latest.json web-discovery-latest.json github-trending-latest.json README.md
          git commit -m "chore: refresh cloud source caches"
          git push --force origin HEAD:x-cloud-cache
